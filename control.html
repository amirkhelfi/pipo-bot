<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIPO BOT – لوحة التحكم</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0f14;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #0d131a;
            border-right: 1px solid #1f2a33;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar h2 {
            color: #ff8c00;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid #1f2a33;
            padding-bottom: 15px;
        }
        .sidebar button {
            background: transparent;
            border: 1px solid #1f2a33;
            color: #aaa;
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: 0.2s;
        }
        .sidebar button:hover, .sidebar button.active {
            background: #1a2530;
            color: #ff8c00;
            border-color: #ff8c00;
        }
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        h3 { color: #ff8c00; margin-bottom: 20px; }
        .card {
            background: #111920;
            border: 1px solid #1f2a33;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #0d131a;
            border: 1px solid #1f2a33;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-box .number {
            font-size: 2em;
            color: #ff8c00;
            font-weight: bold;
        }
        .stat-box .label {
            color: #777;
            font-size: 0.9em;
            margin-top: 5px;
        }
        input, textarea {
            width: 100%;
            background: #0a0f14;
            border: 1px solid #1f2a33;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95em;
            margin: 10px 0;
        }
        button.action {
            background: #ff8c00;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .group-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .group-item {
            padding: 10px;
            border-bottom: 1px solid #1f2a33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ PIPO BOT</h2>
        <button onclick="showTab('dashboard')" class="active">🏠 الرئيسية</button>
        <button onclick="showTab('broadcast')">📢 الإذاعة</button>
        <button onclick="showTab('groups')">👥 المجموعات</button>
    </div>

    <div class="main">
        <div id="dashboard" class="panel active">
            <h3>📊 لوحة التحكم</h3>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="number" id="totalGroups">-</div>
                    <div class="label">المجموعات</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalMuted">-</div>
                    <div class="label">المكتومين</div>
                </div>
            </div>
        </div>

        <div id="broadcast" class="panel">
            <h3>📢 إذاعة</h3>
            <div class="card">
                <textarea id="broadcastMsg" placeholder="اكتب رسالتك..." rows="5"></textarea>
                <button class="action" onclick="sendBroadcast()">إرسال</button>
            </div>
        </div>

        <div id="groups" class="panel">
            <h3>👥 المجموعات</h3>
            <div class="card group-list" id="groupsList"></div>
        </div>
    </div>

    <script>
        const BOT_URL = "https://pipo-bot.onrender.com";
        const TOKEN = "pipomaster2026";

        async function api(path, data = null) {
            const opts = {
                headers: { "Content-Type": "application/json", "X-Bot-Token": TOKEN }
            };
            if (data) {
                opts.method = "POST";
                opts.body = JSON.stringify(data);
            }
            try {
                const res = await fetch(`${BOT_URL}${path}`, opts);
                return await res.json();
            } catch (e) {
                return { error: "تعذر الاتصال" };
            }
        }

        function showTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'dashboard') loadDashboard();
            if (id === 'groups') loadGroups();
        }

        async function loadDashboard() {
            const data = await api('/api/stats');
            if (data) {
                document.getElementById('totalGroups').innerText = data.totalGroups || 0;
                document.getElementById('totalMuted').innerText = data.totalMuted || 0;
            }
        }

        async function loadGroups() {
            const data = await api('/api/groups');
            const container = document.getElementById('groupsList');
            if (data && data.groups) {
                container.innerHTML = data.groups.map(g => `<div class="group-item">${g.name} (${g.id})</div>`).join('');
            }
        }

        async function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (!msg) return alert('اكتب رسالة');
            const data = await api('/api/broadcast', { message: msg });
            if (data.success) alert(`تم الإذاعة إلى ${data.count} مجموعة`);
            document.getElementById('broadcastMsg').value = '';
        }

        loadDashboard();
    </script>
</body>
</html>
