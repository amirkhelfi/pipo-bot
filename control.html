<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIPO BOT – لوحة التحكم</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0f14;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #0d131a;
            border-right: 1px solid #1f2a33;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar h2 {
            color: #ff8c00;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid #1f2a33;
            padding-bottom: 15px;
        }
        .sidebar button {
            background: transparent;
            border: 1px solid #1f2a33;
            color: #aaa;
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: 0.2s;
        }
        .sidebar button:hover, .sidebar button.active {
            background: #1a2530;
            color: #ff8c00;
            border-color: #ff8c00;
        }
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        h3 {
            color: #ff8c00;
            margin-bottom: 20px;
        }
        .card {
            background: #111920;
            border: 1px solid #1f2a33;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #0d131a;
            border: 1px solid #1f2a33;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-box .number {
            font-size: 2em;
            color: #ff8c00;
            font-weight: bold;
        }
        .stat-box .label {
            color: #777;
            font-size: 0.9em;
            margin-top: 5px;
        }
        input, textarea {
            width: 100%;
            background: #0a0f14;
            border: 1px solid #1f2a33;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95em;
            margin: 10px 0;
        }
        button.action {
            background: #ff8c00;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1em;
        }
        button.action:hover {
            background: #e67e00;
        }
        button.danger {
            background: #c0392b;
            color: #fff;
        }
        .group-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .group-item {
            padding: 12px;
            border-bottom: 1px solid #1f2a33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .group-item button {
            background: transparent;
            border: 1px solid #c0392b;
            color: #c0392b;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .success-msg {
            background: #27ae6011;
            border: 1px solid #27ae60;
            color: #27ae60;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .error-msg {
            background: #c0392b11;
            border: 1px solid #c0392b;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ PIPO BOT</h2>
        <button onclick="showTab('dashboard')" class="active">🏠 الرئيسية</button>
        <button onclick="showTab('broadcast')">📢 الإذاعة</button>
        <button onclick="showTab('groups')">👥 المجموعات</button>
        <button onclick="showTab('blacklist')">🚫 القائمة السوداء</button>
    </div>

    <div class="main">
        <!-- Dashboard -->
        <div id="dashboard" class="panel active">
            <h3>📊 لوحة التحكم</h3>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="number" id="totalGroups">-</div>
                    <div class="label">المجموعات المفعلة</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalMuted">-</div>
                    <div class="label">الأعضاء المكتومين</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalBanned">-</div>
                    <div class="label">الأعضاء المحظورين</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalWarnings">-</div>
                    <div class="label">التحذيرات اليوم</div>
                </div>
            </div>
            <div class="card">
                <p>🕒 آخر تحديث: <span id="lastUpdate">-</span></p>
            </div>
        </div>

        <!-- Broadcast -->
        <div id="broadcast" class="panel">
            <h3>📢 إذاعة رسالة إلى جميع المجموعات</h3>
            <div class="card">
                <textarea id="broadcastMsg" placeholder="اكتب رسالتك هنا..." rows="5"></textarea>
                <button class="action" onclick="sendBroadcast()">📨 إرسال الإذاعة</button>
                <div id="broadcastResult" class="hidden"></div>
            </div>
        </div>

        <!-- Groups -->
        <div id="groups" class="panel">
            <h3>👥 المجموعات المفعلة</h3>
            <div class="card">
                <button class="action" onclick="loadGroups()">🔄 تحديث القائمة</button>
                <div class="group-list" id="groupsList">
                    <p>اضغط تحديث لعرض المجموعات...</p>
                </div>
            </div>
        </div>

        <!-- Blacklist -->
        <div id="blacklist" class="panel">
            <h3>🚫 القائمة السوداء العالمية</h3>
            <div class="card">
                <input type="text" id="banUserId" placeholder="أدخل آيدي المستخدم للحظر العالمي">
                <button class="action danger" onclick="addGlobalBan()">حظر عالمي</button>
                <button class="action" onclick="removeGlobalBan()">إلغاء الحظر العالمي</button>
                <div id="blacklistResult" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const BOT_URL = "https://pipo-bot.onrender.com";
        const TOKEN = "pipomaster2026";

        async function api(path, data = null) {
            const opts = {
                headers: { "Content-Type": "application/json", "X-Bot-Token": TOKEN }
            };
            if (data) {
                opts.method = "POST";
                opts.body = JSON.stringify(data);
            }
            try {
                const res = await fetch(`${BOT_URL}${path}`, opts);
                return await res.json();
            } catch (e) {
                return { error: "تعذر الاتصال بالبوت" };
            }
        }

        function showTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (tabId === 'groups') loadGroups();
            if (tabId === 'dashboard') loadDashboard();
        }

        async function loadDashboard() {
            const data = await api('/api/stats');
            if (data) {
                document.getElementById('totalGroups').innerText = data.totalGroups || 0;
                document.getElementById('totalMuted').innerText = data.totalMuted || 0;
                document.getElementById('totalBanned').innerText = data.totalBanned || 0;
                document.getElementById('totalWarnings').innerText = data.totalWarnings || 0;
                document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString('ar-DZ');
            }
        }

        async function loadGroups() {
            const container = document.getElementById('groupsList');
            container.innerHTML = '<p>جاري التحميل...</p>';
            const data = await api('/api/groups');
            if (data && data.groups) {
                container.innerHTML = data.groups.map(g => `
                    <div class="group-item">
                        <span>${g.name} (${g.id})</span>
                        <button onclick="leaveGroup(${g.id})">خروج</button>
                    </div>
                `).join('');
            }
        }

        async function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (!msg) return alert('الرجاء كتابة رسالة.');
            const data = await api('/api/broadcast', { message: msg });
            const result = document.getElementById('broadcastResult');
            result.classList.remove('hidden');
            if (data.success) {
                result.className = 'success-msg';
                result.innerText = `✅ تم إذاعة الرسالة إلى ${data.count} مجموعة.`;
                document.getElementById('broadcastMsg').value = '';
            } else {
                result.className = 'error-msg';
                result.innerText = '❌ فشل الإذاعة.';
            }
        }

        async function leaveGroup(gid) {
            if (!confirm('هل أنت متأكد من الخروج من هذه المجموعة؟')) return;
            const data = await api('/api/leave', { group_id: gid });
            if (data.success) {
                loadGroups();
            }
        }

        async function addGlobalBan() {
            const uid = document.getElementById('banUserId').value.trim();
            if (!uid) return alert('أدخل آيدي المستخدم.');
            const data = await api('/api/globalban', { user_id: parseInt(uid) });
            const result = document.getElementById('blacklistResult');
            result.classList.remove('hidden');
            if (data.success) {
                result.className = 'success-msg';
                result.innerText = '✅ تم الحظر العالمي.';
            } else {
                result.className = 'error-msg';
                result.innerText = '❌ فشل الحظر.';
            }
        }

        async function removeGlobalBan() {
            const uid = document.getElementById('banUserId').value.trim();
            if (!uid) return alert('أدخل آيدي المستخدم.');
            const data = await api('/api/globalban', { user_id: parseInt(uid), remove: true });
            const result = document.getElementById('blacklistResult');
            result.classList.remove('hidden');
            if (data.success) {
                result.className = 'success-msg';
                result.innerText = '✅ تم إلغاء الحظر العالمي.';
            } else {
                result.className = 'error-msg';
                result.innerText = '❌ فشل إلغاء الحظر.';
            }
        }

        loadDashboard();
    </script>
</body>
</html>
