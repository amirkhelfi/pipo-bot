<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIPO BOT – لوحة التحكم المتطورة</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0f14;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #0d131a;
            border-right: 1px solid #1f2a33;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar h2 {
            color: #ff8c00;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid #1f2a33;
            padding-bottom: 15px;
        }
        .sidebar button {
            background: transparent;
            border: 1px solid #1f2a33;
            color: #aaa;
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: 0.2s;
        }
        .sidebar button:hover, .sidebar button.active {
            background: #1a2530;
            color: #ff8c00;
            border-color: #ff8c00;
        }
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        h3 { color: #ff8c00; margin-bottom: 20px; }
        .card {
            background: #111920;
            border: 1px solid #1f2a33;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #0d131a;
            border: 1px solid #1f2a33;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-box .number { font-size: 2em; color: #ff8c00; font-weight: bold; }
        .stat-box .label { color: #777; font-size: 0.9em; margin-top: 5px; }
        input, textarea, select {
            width: 100%;
            background: #0a0f14;
            border: 1px solid #1f2a33;
            color: #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95em;
            margin: 10px 0;
        }
        button.action {
            background: #ff8c00;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.danger { background: #c0392b; color: #fff; }
        button.success { background: #27ae60; color: #fff; }
        .mute-card {
            background: #1a1520;
            border: 1px solid #ff8c0055;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .mute-info { flex: 1; }
        .mute-name { color: #ff8c00; font-weight: bold; }
        .mute-time { color: #aaa; font-size: 0.9em; }
        .mute-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .notification-badge {
            background: #c0392b;
            color: #fff;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8em;
            margin-right: 5px;
        }
        .status-active { color: #27ae60; font-weight: bold; }
        .status-inactive { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ PIPO BOT</h2>
        <button onclick="showTab('dashboard')" class="active">🏠 الرئيسية</button>
        <button onclick="showTab('muted')" id="mutedTab">🔇 المكتومين <span class="notification-badge" id="mutedCount">0</span></button>
        <button onclick="showTab('broadcast')">📢 الإذاعة</button>
        <button onclick="showTab('groups')">👥 المجموعات</button>
        <button onclick="showTab('blacklist')">🚫 القائمة السوداء</button>
        <button onclick="showTab('inactive')">📋 إدارة المجموعات</button>
    </div>

    <div class="main">
        <!-- Dashboard -->
        <div id="dashboard" class="panel active">
            <h3>📊 لوحة القيادة</h3>
            <div class="stat-grid">
                <div class="stat-box"><div class="number" id="totalGroups">-</div><div class="label">المجموعات</div></div>
                <div class="stat-box"><div class="number" id="totalMuted">-</div><div class="label">المكتومين</div></div>
                <div class="stat-box"><div class="number" id="totalBanned">-</div><div class="label">المحظورين</div></div>
                <div class="stat-box"><div class="number" id="totalWarnings">-</div><div class="label">التحذيرات</div></div>
            </div>
        </div>

        <!-- Muted Members -->
        <div id="muted" class="panel">
            <h3>🔇 الأعضاء المكتومين</h3>
            <button class="action" onclick="loadMuted()">🔄 تحديث</button>
            <div id="mutedList"></div>
        </div>

        <!-- Broadcast -->
        <div id="broadcast" class="panel">
            <h3>📢 إذاعة</h3>
            <div class="card">
                <textarea id="broadcastMsg" placeholder="اكتب رسالتك..." rows="5"></textarea>
                <button class="action" onclick="sendBroadcast()">📨 إرسال</button>
                <div id="broadcastResult"></div>
            </div>
        </div>

        <!-- Groups -->
        <div id="groups" class="panel">
            <h3>👥 المجموعات المفعلة</h3>
            <button class="action" onclick="loadGroups()">🔄 تحديث</button>
            <div id="groupsList"></div>
        </div>

        <!-- Blacklist -->
        <div id="blacklist" class="panel">
            <h3>🚫 القائمة السوداء</h3>
            <div class="card">
                <input type="text" id="banUserId" placeholder="آيدي المستخدم">
                <button class="action danger" onclick="addGlobalBan()">حظر عالمي</button>
                <button class="action success" onclick="removeGlobalBan()">فك حظر عالمي</button>
            </div>
        </div>

        <!-- Inactive Groups -->
        <div id="inactive" class="panel">
            <h3>📋 إدارة جميع المجموعات</h3>
            <button class="action" onclick="loadInactiveGroups()">🔄 تحديث</button>
            <div id="inactiveList"></div>
        </div>
    </div>

    <script>
        const BOT_URL = "https://pipo-bot.onrender.com";
        const TOKEN = "pipomaster2026";

        async function api(path, data = null) {
            const opts = {
                headers: { "Content-Type": "application/json", "X-Bot-Token": TOKEN }
            };
            if (data) { opts.method = "POST"; opts.body = JSON.stringify(data); }
            try {
                const res = await fetch(`${BOT_URL}${path}`, opts);
                return await res.json();
            } catch (e) { return { error: "تعذر الاتصال" }; }
        }

        function showTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (tabId === 'muted') loadMuted();
            if (tabId === 'groups') loadGroups();
            if (tabId === 'dashboard') loadDashboard();
            if (tabId === 'inactive') loadInactiveGroups();
        }

        async function loadDashboard() {
            const data = await api('/api/stats');
            if (data) {
                document.getElementById('totalGroups').innerText = data.totalGroups || 0;
                document.getElementById('totalMuted').innerText = data.totalMuted || 0;
                document.getElementById('totalBanned').innerText = data.totalBanned || 0;
                document.getElementById('totalWarnings').innerText = data.totalWarnings || 0;
                document.getElementById('mutedCount').innerText = data.totalMuted || 0;
            }
        }

        async function loadMuted() {
            const container = document.getElementById('mutedList');
            container.innerHTML = '<p>جاري التحميل...</p>';
            const data = await api('/api/muted');
            if (data && data.muted) {
                container.innerHTML = data.muted.map(m => `
                    <div class="mute-card">
                        <div class="mute-info">
                            <div class="mute-name">${m.name} (${m.uid})</div>
                            <div class="mute-time">⏳ متبقي: ${m.remaining} دقيقة | المجموعة: ${m.group}</div>
                        </div>
                        <div class="mute-actions">
                            <button class="action success" onclick="unmuteUser(${m.uid}, '${m.chat_id}')">🔓 فك الكتم</button>
                            <button class="action" onclick="extendMute(${m.uid}, '${m.chat_id}')">⏰ زيادة 10 دقائق</button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('mutedCount').innerText = data.muted.length;
            }
        }

        async function unmuteUser(uid, chatId) {
            await api('/api/unmute', { uid: uid, chat_id: chatId });
            loadMuted();
            loadDashboard();
        }

        async function extendMute(uid, chatId) {
            await api('/api/extendmute', { uid: uid, chat_id: chatId, minutes: 10 });
            loadMuted();
        }

        async function loadGroups() {
            const container = document.getElementById('groupsList');
            const data = await api('/api/groups');
            if (data && data.groups) {
                container.innerHTML = data.groups.map(g => `<div class="mute-card"><span>${g.name} (${g.id})</span></div>`).join('');
            }
        }

        async function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value.trim();
            if (!msg) return alert('اكتب رسالة');
            const data = await api('/api/broadcast', { message: msg });
            document.getElementById('broadcastResult').innerText = data.success ? `✅ تم الإذاعة إلى ${data.count} مجموعة` : '❌ فشل';
        }

        async function addGlobalBan() {
            const uid = document.getElementById('banUserId').value.trim();
            if (!uid) return alert('أدخل آيدي');
            await api('/api/globalban', { user_id: parseInt(uid) });
            alert('تم');
        }

        async function removeGlobalBan() {
            const uid = document.getElementById('banUserId').value.trim();
            if (!uid) return alert('أدخل آيدي');
            await api('/api/globalban', { user_id: parseInt(uid), remove: true });
            alert('تم');
        }

        async function loadInactiveGroups() {
            const container = document.getElementById('inactiveList');
            container.innerHTML = '<p>جاري التحميل...</p>';
            const data = await api('/api/inactive');
            if (data && data.groups) {
                container.innerHTML = data.groups.map(g => `
                    <div class="mute-card">
                        <span>${g.name} (${g.id})</span>
                        <span>
                            الحالة: ${g.active ? '<span class="status-active">✅ مفعلة</span>' : '<span class="status-inactive">❌ غير مفعلة</span>'}
                        </span>
                        <button class="action ${g.active ? 'danger' : 'success'}" onclick="toggleGroup('${g.id}', ${g.active})">
                            ${g.active ? '❌ تعطيل' : '✅ تفعيل'}
                        </button>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p>لا توجد مجموعات.</p>';
            }
        }

        async function toggleGroup(gid, isActive) {
            if (isActive) {
                // تعطيل
                await api('/api/deactivate', { chat_id: gid });
            } else {
                // تفعيل
                await api('/api/activate', { chat_id: gid });
            }
            loadInactiveGroups();
            loadDashboard();
            loadGroups();
        }

        // تحديث تلقائي كل 30 ثانية
        setInterval(() => {
            if (document.getElementById('muted').classList.contains('active')) loadMuted();
            if (document.getElementById('dashboard').classList.contains('active')) loadDashboard();
        }, 30000);

        loadDashboard();
    </script>
</body>
</html>
